services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: confeti
      POSTGRES_PASSWORD: confeti
      POSTGRES_DB: confeti
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confeti -d confeti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
